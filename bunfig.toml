telemetry = false
logLevel = "debug" # "debug" | "warn" | "error"

[test]
root = 'test'
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"

[install]
# Whether to set an exact version in package.json even if a range is specified
exact = true
# Only install package versions published at least 7 days ago
# minimumReleaseAge = 604800 # seconds
# Exclude trusted packages from the age gate
# minimumReleaseAgeExcludes = ["@types/node", "typescript", "@types/bun", "@biomejs/biome", "oxlint", "dprint"]

[console]
depth = 6
